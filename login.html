<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login // Muz.dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl space-y-6 shadow-2xl relative">
        <div class="text-center space-y-2">
            <span class="text-xs uppercase font-mono text-neonBlue tracking-widest">-- Security Clearance --</span>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-100">Admin Login</h1>
            <p class="text-slate-400 text-xs">Masukkan kredensial untuk mengakses panel kontrol.</p>
        </div>

        <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Username</label>
                <input type="text" id="username" required class="w-full px-4 py-3 bg-slate-950 rounded-xl border border-slate-800 focus:border-neonBlue outline-none text-sm text-slate-100 transition">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-950 rounded-xl border border-slate-800 focus:border-neonBlue outline-none text-sm text-slate-100 transition">
            </div>

            <div id="error-msg" class="text-red-400 text-xs text-center hidden"></div>

            <button type="submit" id="submit-btn" class="w-full py-3 bg-neonBlue text-white font-semibold rounded-xl lightsaber-glow hover:scale-[1.02] transition transform text-sm">
                Authenticate
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-500 hover:text-neonBlue transition">← Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        // URL Web App Google Apps Script Kak Muz
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzSPyvqpxDMblfjbP16V7aHY2VMLnZxCJLdGZku9_BE5CErgjgQH3LRALsuDO0CT-X5/exec";

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submit-btn');

            errorMsg.classList.add('hidden');
            submitBtn.innerText = "Verifying...";
            submitBtn.disabled = true;

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "login",
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                const result = await response.json();

                if (result.status === "success") {
                    // Simpan status sesi sederhana di browser
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("adminUser", usernameInput);
                    
                    // Alihkan ke admin.html (akan kita buat di tahap 2)
                    window.location.href = "admin.html";
                } else {
                    errorMsg.innerText = result.message;
                    errorMsg.classList.remove('hidden');
                    submitBtn.innerText = "Authenticate";
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errorMsg.innerText = "Terjadi kesalahan koneksi ke server.";
                errorMsg.classList.remove('hidden');
                submitBtn.innerText = "Authenticate";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
